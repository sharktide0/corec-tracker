<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoRec Gym Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
 :root{--bg:#111;--card:#1c1c1c;--fg:#eee;--dim:#999;--line:#333;--gold:#cfb991}
 body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;padding:20px 16px;max-width:1100px}
 h1{margin:0 0 4px;font-size:22px}.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
 .now{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
 .card{background:var(--card);border-radius:10px;padding:14px 18px;flex:1;min-width:150px}
 .card b{font-size:30px;display:block}.card span{color:var(--dim);font-size:13px}
 .box{background:var(--card);border-radius:10px;padding:16px;margin-bottom:16px}
 h2{font-size:15px;margin:0 0 10px;color:#ccc}
 .tabs button,.nav button{background:#2a2a2a;color:var(--fg);border:0;border-radius:6px;padding:6px 12px;margin-right:6px;cursor:pointer;font:inherit;font-size:13px}
 .tabs button.on{background:var(--gold);color:#111}
 .nav button:disabled{opacity:.3;cursor:default}
 /* calendar */
 .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
 .calhead h2{margin:0}
 .nav{display:flex;align-items:center;gap:4px}
 .nav span{min-width:120px;text-align:center;font-size:14px}
 .nav button{margin:0;padding:6px 10px}
 .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
 .cal .dow{color:var(--dim);font-size:12px;text-align:center;padding-bottom:2px}
 .day{border:0;border-radius:6px;min-height:56px;padding:5px 6px;text-align:left;font:inherit;color:var(--fg);background:#161616;display:flex;flex-direction:column;justify-content:space-between}
 .day.has{cursor:pointer;background:rgba(207,185,145,var(--a))}
 .day.has:hover{outline:1px solid var(--gold)}
 .day.sel{outline:2px solid var(--fg)!important}
 .day.today .n{color:var(--gold);font-weight:700}
 .day.has .n{color:#fff}
 .day .n{font-size:12px;color:#666}
 .day .pk{font-size:11px;line-height:1.3;color:#fff;opacity:.9}
 .legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:8px}
 .legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
 .daydetail{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
 .daydetail h3{margin:0 0 4px;font-size:15px}
 .daydetail .stats{color:var(--dim);font-size:13px;margin-bottom:10px}
 @media (max-width:560px){.day .pk{display:none}.day{min-height:40px}.nav span{min-width:96px}}
</style></head><body>
<h1>CoRec Upper + Lower Gym</h1>
<div class="sub" id="sub">Loading...</div>
<div class="now" id="now"></div>
<div class="box"><h2>Busiest time</h2>
 <div class="tabs" id="wd" style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 0"></div>
 <div class="now" id="busy" style="margin:0 0 14px"></div>
 <canvas id="h" height="90"></canvas>
 <div id="bnote" style="font-size:12px;color:#888;margin-top:6px"></div></div>
<div class="box"><h2>People over time</h2>
 <div class="tabs" id="tabs"><button data-d="1" class="on">Today</button><button data-d="7">7 days</button><button data-d="0">All</button></div>
 <canvas id="t" height="120"></canvas></div>
<div class="box">
 <div class="calhead"><h2>Daily history</h2>
  <div class="nav"><button id="prev" aria-label="Previous month">&#8249;</button><span id="month"></span><button id="next" aria-label="Next month">&#8250;</button></div></div>
 <div class="cal" id="cal"></div>
 <div class="legend">Shade = how full it got that day (peak %) <i style="background:rgba(207,185,145,.15)"></i><i style="background:rgba(207,185,145,.45)"></i><i style="background:rgba(207,185,145,.8)"></i> · numbers = peak people (U = Upper, L = Lower)</div>
 <div class="daydetail" id="daydetail" hidden><h3 id="dtitle"></h3><div class="stats" id="dstats"></div><canvas id="d" height="110"></canvas></div>
</div>
<div class="box"><h2>Average by day of week</h2><canvas id="w" height="70"></canvas></div>
<script>
const AREAS=["Upper Gym","Lower Gym"], C={"Upper Gym":"#cfb991","Lower Gym":"#5b9bd5"};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
Chart.defaults.color="#aaa";Chart.defaults.borderColor="#333";
// phones: give charts a taller shape so they aren't squashed flat (canvas default width is 300)
if(innerWidth<600)document.querySelectorAll("canvas").forEach(c=>c.setAttribute("height",c.id=="w"?170:230));
let rows=[],tChart,dChart,byDay={},calMonth,selDay;
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const midnight=d=>{const m=new Date(d);m.setHours(0,0,0,0);return m};
const fmtTime=d=>d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

fetch("log.csv?"+Date.now()).then(r=>r.text()).then(txt=>{
  rows=txt.trim().split("\n").slice(1).map(l=>{const[t,a,c,cap,p,u]=l.trim().split(",");return{t:new Date(t),a,c:+c,cap:+cap,p:+p,u}}).filter(r=>!isNaN(r.t)).sort((x,y)=>x.t-y.t);
  if(!rows.length){document.getElementById("sub").textContent="No data yet. First check runs within 15 min.";return}
  const last=rows[rows.length-1].t;
  document.getElementById("sub").textContent=`Plots only when Purdue posts an update · last update ${last.toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})} · ${rows.length} readings logged`;
  document.getElementById("now").innerHTML=AREAS.map(a=>{const r=rows.filter(x=>x.a==a).pop();return `<div class="card"><span>${a} now</span><b>${r?r.c:"-"}</b><span>${r?`${r.p}% full · cap ${r.cap}`:"closed"}</span></div>`}).join("");
  rows.forEach(r=>{(byDay[dayKey(r.t)]=byDay[dayKey(r.t)]||[]).push(r)});
  drawTime(1);drawAvg();drawWdTabs();drawBusy();
  calMonth=new Date(last.getFullYear(),last.getMonth(),1);
  selDay=dayKey(last);
  drawCal();drawDay(selDay);
});

function lineChart(el,rs,min,max,unit){
  return new Chart(el,{type:"line",
    data:{datasets:AREAS.map(a=>({label:a,data:withGaps(rs.filter(r=>r.a==a)),borderColor:C[a],backgroundColor:C[a],pointRadius:2,tension:.25}))},
    options:{scales:{x:{type:"time",min,max,time:{unit,tooltipFormat:"EEE MMM d, h:mm a",displayFormats:{hour:"h a",day:"EEE M/d"}}},y:{beginAtZero:true,title:{display:true,text:"people"}}},
      plugins:{tooltip:{callbacks:{label:c=>c.raw.y==null?"":`${c.dataset.label}: ${c.raw.y} (${c.raw.p}%)`}}}}});
}
function drawTime(days){
  const from=days==1?midnight(new Date()).getTime():days?Date.now()-days*864e5:0;
  tChart&&tChart.destroy();
  tChart=lineChart(document.getElementById("t"),rows.filter(r=>r.t>=from),days==1?from+6*36e5:undefined,days==1?from+24*36e5:undefined,days==1?"hour":"day");
}
// break the line when there's a 2h+ gap (closed overnight) instead of drawing across it
function withGaps(rs){const out=[];rs.forEach((r,i)=>{if(i&&r.t-rs[i-1].t>2*36e5)out.push({x:new Date(rs[i-1].t.getTime()+1),y:null});out.push({x:r.t,y:r.c,p:r.p})});return out}
document.getElementById("tabs").onclick=e=>{if(e.target.tagName!="BUTTON")return;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b==e.target));drawTime(+e.target.dataset.d)};

// ---- calendar ----
const peak=(rs,a)=>rs.filter(r=>r.a==a).reduce((m,x)=>!m||x.c>m.c?x:m,null);
function drawCal(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  document.getElementById("month").textContent=calMonth.toLocaleDateString([], {month:"long",year:"numeric"});
  const first=new Date(rows[0].t.getFullYear(),rows[0].t.getMonth(),1), now=new Date(), lastM=new Date(now.getFullYear(),now.getMonth(),1);
  document.getElementById("prev").disabled=calMonth<=first;
  document.getElementById("next").disabled=calMonth>=lastM;
  const todayK=dayKey(now), n=new Date(y,m+1,0).getDate(), lead=new Date(y,m,1).getDay();
  let h=DAYS.map(d=>`<div class="dow">${d}</div>`).join("")+"<div></div>".repeat(lead);
  for(let d=1;d<=n;d++){
    const k=dayKey(new Date(y,m,d)), rs=byDay[k];
    const cls=["day"]; if(k==todayK)cls.push("today"); if(k==selDay)cls.push("sel");
    if(!rs){h+=`<div class="${cls.join(" ")}"><span class="n">${d}</span></div>`;continue}
    cls.push("has");
    const u=peak(rs,"Upper Gym"), l=peak(rs,"Lower Gym"), pct=Math.max(...rs.map(r=>r.p));
    const a=(.12+Math.min(pct,100)/100*1.4).toFixed(2); // 50% full ≈ fully shaded
    h+=`<button class="${cls.join(" ")}" data-k="${k}" style="--a:${Math.min(a,.85)}" aria-label="${k}: peak Upper ${u?u.c:"-"}, Lower ${l?l.c:"-"}"><span class="n">${d}</span><span class="pk">U ${u?u.c:"-"}<br>L ${l?l.c:"-"}</span></button>`;
  }
  document.getElementById("cal").innerHTML=h;
}
document.getElementById("cal").onclick=e=>{const b=e.target.closest(".day.has");if(!b)return;selDay=b.dataset.k;drawCal();drawDay(selDay)};
document.getElementById("prev").onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);drawCal()};
document.getElementById("next").onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);drawCal()};

function drawDay(k){
  const rs=byDay[k]; if(!rs)return;
  const day=midnight(rs[0].t);
  document.getElementById("daydetail").hidden=false;
  document.getElementById("dtitle").textContent=day.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"});
  document.getElementById("dstats").innerHTML=AREAS.map(a=>{const p=peak(rs,a);return p?`${a}: peak <b style="color:${C[a]}">${p.c}</b> (${p.p}%) at ${fmtTime(p.t)}`:`${a}: no data`}).join(" &nbsp;·&nbsp; ")+` &nbsp;·&nbsp; ${rs.length} readings`;
  dChart&&dChart.destroy();
  dChart=lineChart(document.getElementById("d"),rs,day.getTime()+6*36e5,day.getTime()+24*36e5,"hour");
}

function avgBy(fn,n){return AREAS.map(a=>{const s=Array.from({length:n},()=>[]);rows.filter(r=>r.a==a).forEach(r=>s[fn(r.t)].push(r.c));return{label:a,backgroundColor:C[a],data:s.map(v=>v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null)}})}
const hr=h=>(h%12||12)+(h<12?" AM":" PM");
// ---- busiest time, filtered by weekday (-1 = every day) ----
let wd=new Date().getDay(),hChart;
const avg=v=>Math.round(v.reduce((x,y)=>x+y,0)/v.length);
function drawWdTabs(){
  const has=new Set(rows.map(r=>r.t.getDay()));
  document.getElementById("wd").innerHTML=[-1,0,1,2,3,4,5,6].map(d=>`<button data-d="${d}" class="${d==wd?"on":""}"${d>=0&&!has.has(d)?' style="opacity:.45"':""}>${d<0?"Every day":DAYS[d]}</button>`).join("");
}
document.getElementById("wd").onclick=e=>{if(e.target.tagName!="BUTTON")return;wd=+e.target.dataset.d;drawWdTabs();drawBusy()};
function drawBusy(){
  const pick=rows.filter(r=>wd<0||r.t.getDay()==wd);
  const label=wd<0?"":DAYS[wd]+" ";
  const weeks=new Set(pick.map(r=>dayKey(r.t))).size;
  document.getElementById("busy").innerHTML=AREAS.map(a=>{
    const rs=pick.filter(r=>r.a==a);
    if(!rs.length) return `<div class="card"><span>${a}</span><b style="font-size:22px">-</b><span>No ${wd<0?"":DAYS[wd]+" "}data yet</span></div>`;
    const s={}; rs.forEach(r=>{(s[r.t.getHours()]=s[r.t.getHours()]||[]).push(r.c)});
    const slots=Object.entries(s).map(([h,v])=>({h:+h,avg:avg(v)}));
    const top=slots.reduce((m,x)=>x.avg>m.avg?x:m), low=slots.reduce((m,x)=>x.avg<m.avg?x:m);
    const pk=rs.reduce((m,x)=>x.c>m.c?x:m);
    return `<div class="card"><span>${a} · busiest</span><b style="font-size:22px">${label}${hr(top.h)}</b><span>avg ${top.avg} people</span>
      <div style="margin-top:10px;font-size:13px;color:#bbb">Quietest: ${label}${hr(low.h)} (avg ${low.avg})<br>Record: ${pk.c} on ${pk.t.toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</div></div>`;
  }).join("");
  hChart&&hChart.destroy();
  hChart=new Chart(document.getElementById("h"),{type:"bar",data:{labels:[...Array(24).keys()].map(h=>(h%12||12)+(h<12?"a":"p")),datasets:AREAS.map(a=>{const s=Array.from({length:24},()=>[]);pick.filter(r=>r.a==a).forEach(r=>s[r.t.getHours()].push(r.c));return{label:a,backgroundColor:C[a],data:s.map(v=>v.length?avg(v):null)}})},
    options:{scales:{y:{beginAtZero:true,title:{display:true,text:"avg people"}}},plugins:{title:{display:true,text:`Average people by hour${wd<0?"":" on "+DAYS[wd]+"s"}`,color:"#ccc"}}}});
  document.getElementById("bnote").textContent=weeks?`Based on ${weeks} day${weeks>1?"s":""} of data. Gets more accurate as more weeks are logged.`:"";
}
function drawAvg(){
  new Chart(document.getElementById("w"),{type:"bar",data:{labels:DAYS,datasets:avgBy(d=>d.getDay(),7)},options:{scales:{y:{beginAtZero:true}}}});
}
</script></body></html>
