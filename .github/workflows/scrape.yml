name: Scrape CoRec
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scrape.py
      - run: |
          git config user.name "corec-bot"
          git config user.email "corec-bot@users.noreply.github.com"
          git add docs/log.csv
          git diff --cached --quiet || (git commit -m "log $(date -u +%H:%M)" && git push)
